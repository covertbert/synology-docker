name: tmdb-radarr

services:
  tmdb-radarr-digital:
    image: docker.io/covertbert/tmdb-radarr-updater:latest
    container_name: tmdb-radarr-digital
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?set TMDB_API_KEY in .env}
      - TMDB_LANGUAGE=en-US
      - TMDB_MIN_SCORE=7
      - TMDB_MIN_VOTE_COUNT=500
      - TMDB_RELEASE_WINDOW_DAYS=14
      - RADARR_URL=http://192.168.178.64:7878
      - RADARR_API_KEY=${RADARR_API_KEY:?set RADARR_API_KEY in .env}
      - RADARR_ROOT_FOLDER_PATH=/data/media/movies
      - RADARR_QUALITY_PROFILE_NAME=Prefer 1080 - Allow 4k
      - RADARR_SEARCH_ON_ADD=true
      - RADARR_MONITORED=true
      - RADARR_MINIMUM_AVAILABILITY=released
      - DRY_RUN=false
    command: ["tail", "-f", "/dev/null"]
    labels:
      ofelia.enabled: "true"
      # Every Monday at 05:00 (container timezone).
      ofelia.job-exec.tmdb-radarr-sync.schedule: "0 5 * * *"
      ofelia.job-exec.tmdb-radarr-sync.command: "node dist/index.js"
      ofelia.job-exec.tmdb-radarr-sync.no-overlap: "true"
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia
    restart: always
    depends_on:
      - tmdb-radarr-digital
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/London
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
